# hyprlock config - lean Omarchy mimic, rgba (hyprlock requires rgba, not hex) - colors match #33ccff / #2b303b
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 5
    blur_size = 5
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    inner_color = rgba(43, 48, 59, 0.6)
    outer_color = rgba(51, 204, 255, 1.0)
    check_color = rgba(51, 204, 255, 1.0)
    fail_color = rgba(235, 77, 75, 1.0)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    rounding = 2
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(51, 204, 255, 1.0)
    # color = rgba(255, 255, 255, 1.0)
    font_size = 60
    font_family = $font
    position = 0, 75
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(255, 255, 255, 1.0)
    font_size = 16
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
}
